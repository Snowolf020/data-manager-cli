version: '3'

services:
  app:
    build: ./docker
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/database
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    command: go run main.go

  postgres:
    image: postgres:14
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=database
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    volumes:
      - redis-data:/data

  sqlite:
    image: busybox
    volumes:
      - ./db/sqlite.db:/sqlite.db
    command: sleep 1000

volumes:
  postgres-data:
  redis-data: